[platformio]
default_envs = native

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -std=gnu++17
build_src_filter = +<main.cpp> +<telemetry.cpp>
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<telemetry.cpp>
test_framework = unity
